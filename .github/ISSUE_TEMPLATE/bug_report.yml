name: Bug Report
description: File a bug report to help us improve
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: Firmware Version
      description: Which version are you running?
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: board
    attributes:
      label: Board
      options:
        - ESP32 Dev Module
        - ESP32-C3
        - ESP32-S3
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: "A clear and concise description of the bug."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Serial Monitor Output
      description: Paste relevant serial monitor output (baud rate 115200)
      render: shell
  - type: textarea
    id: hardware
    attributes:
      label: Hardware Setup
      description: Describe your sensor and display wiring
      placeholder: "- AHT10 on I2C (SDA=21, SCL=22)\n- DHT22 on GPIO4\n- SSD1306 OLED on I2C (0x3C)"
